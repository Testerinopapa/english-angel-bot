<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0b5a" />
      <stop offset="50%" stop-color="#1f0a44" />
      <stop offset="100%" stop-color="#12032b" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b3ba7" />
      <stop offset="100%" stop-color="#431b75" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0fa" />
      <stop offset="100%" stop-color="#dcd2ea" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="18" y="18" width="476" height="476" rx="120" ry="120" fill="url(#bgGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="112" ry="112" fill="none" stroke="#fec84d" stroke-width="6" stroke-opacity="0.35" />

  <!-- Headphone Band -->
  <path d="M 140 252 A 130 130 0 0 1 372 252" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

  <!-- Robot Head -->
  <circle cx="256" cy="268" r="116" fill="url(#headGrad)" stroke="#ffffff" stroke-width="8" />

  <!-- Earcups -->
  <rect x="122" y="218" width="30" height="66" rx="14" fill="#c3b2dd" stroke="#ffffff" stroke-width="6" />
  <rect x="360" y="218" width="30" height="66" rx="14" fill="#c3b2dd" stroke="#ffffff" stroke-width="6" />

  <!-- Visor -->
  <rect x="180" y="226" width="152" height="62" rx="28" fill="url(#visorGrad)" stroke="#320f5c" stroke-width="3" />

  <!-- Eyes -->
  <circle cx="218" cy="257" r="15" fill="#fec84d" />
  <circle cx="218" cy="257" r="9" fill="#1f0a44" />
  <circle cx="221" cy="254" r="3.5" fill="#ffffff" />

  <circle cx="294" cy="257" r="15" fill="#fec84d" />
  <circle cx="294" cy="257" r="9" fill="#1f0a44" />
  <circle cx="297" cy="254" r="3.5" fill="#ffffff" />

  <!-- Mouth -->
  <path d="M 234 316 Q 256 342 278 316" fill="#521b96" stroke="#42137d" stroke-width="3" stroke-linecap="round" />

  <!-- Microphone Boom -->
  <path d="M 144 270 Q 160 370 242 364" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <circle cx="250" cy="362" r="13" fill="#25D366" stroke="#ffffff" stroke-width="4" />
</svg>